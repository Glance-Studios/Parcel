# Parcel

# Development tooling - /parcel calibrate, for measuring the text display panel constants below.
# Off in production: with this false the commands are never registered, so they do not show up in
# help or tab completion, and the tool's listener is never hooked up.
#
# Turn it on when a Minecraft version bump changes font metrics and the panel constants need
# remeasuring. That is the whole reason the tool ships rather than living in a separate artifact.
dev-tools: false

tracking:
  # How often, in ticks, player region membership is recalculated.
  # This is the only recurring cost Parcel adds; raise it if you have very many regions and do not
  # need frame-tight enter/exit events.
  interval-ticks: 5

marquee:
  # The selection wand. Deliberately NOT a wooden axe - that is WorldEdit's wand, and on a server
  # running both, every click would be claimed twice.
  # The item is identified by a hidden tag, not by material or name, so a renamed item cannot
  # impersonate it and an ordinary axe is unaffected.
  wand-material: GOLDEN_AXE

  # What a new selection starts as.
  #   FLAT   - a footprint spanning the full world height. Y is ignored when marking corners.
  #   VOLUME - a bounded box, using both corners' Y.
  # FLAT by default because most regions are areas of the map rather than boxes floating in it, and
  # getting the Y wrong on a volume is invisible until something fails to trigger.
  # Change per selection with /mq mode.
  default-mode: FLAT

  # Logs every wand interaction with its action, hand and sneak state. Bindings that "do nothing"
  # are almost always an event that never arrived or arrived with different state than expected,
  # and this says which.
  debug: false

panels:
  # Translucent panels over a region's meshed surface, via /parcel render.
  # Interior faces are already gone and coplanar faces merged, so two flush boxes are six faces.

  # TEXT  - a mirrored pair of text displays per face. Any colour, any alpha. Two entities per face,
  #         because a text display only renders from one side.
  # BLOCK - one thin stained-glass block display per face. Exact, two-sided for free, but limited to
  #         the glass palette. Useful as the ground truth to calibrate TEXT against.
  primitive: TEXT

  # ARGB for TEXT panels. Alpha is what makes them see-through.
  #
  # This is the STARTING point, not the last word: /parcel style with no region name edits the
  # default in game and writes it to styles.yml, and once that exists it wins over this. Order is
  # the region's own style, then the saved default, then here.
  colour:
    red: 85
    green: 200
    blue: 255
    alpha: 90

  # Size in blocks of an empty text display's background at scale 1, and where that quad sits
  # relative to its entity. Both MEASURED with /parcel calibrate on 1.21.11, not derived - a text
  # display's quad is sized by its glyphs and padding.
  #
  # The values landing on exact eighths and quarters is not a coincidence: a text display renders at
  # 40 font units per block, a space glyph is 5 units wide with its spacing, and a line is 10 units
  # tall with its background padding. So 5/40 and 10/40.
  text-base-width: 0.1250
  text-base-height: 0.2500

  # anchor-y is exactly half the height, because the entity sits on the quad's bottom edge - text
  # hangs above its position like a nametag rather than being centred on it. The correction scales
  # with the panel, so it is stored per unit of scale and multiplied back up per face.
  text-anchor-x: 0.0125
  text-anchor-y: 0.1250

  # Only used by BLOCK.
  material: LIGHT_BLUE_STAINED_GLASS

  # Slab depth, straddling the face plane so it reads as a surface rather than sitting to one side.
  thickness: 0.02

  # Lift off the surface being covered, along the face normal. A panel sitting exactly on a block
  # face z-fights with it and flickers. Because the normal is perpendicular to both axes the panel
  # is sized on, this only changes depth - it cannot disturb size or alignment, so it is safe to
  # raise without recalibrating anything.
  surface-offset: 0.01

  # Flat regions span the world's full height, so drawing their real surface gives a floor at
  # bedrock, a ceiling at the build limit and four walls hundreds of blocks tall - correct, and
  # useless. They are drawn as a CROSS-SECTION instead: a one-block slab at ground level that
  # blankets the footprint. This is how far above the surface that slab sits.
  # Only affects what is drawn; the region's real geometry is untouched.
  flat-offset: 1

  # A flat region's plane can ride under the nearest player instead of sitting at ground level, so
  # its footprint stays readable while you fly rather than being buried in terrain.
  follow:
    # Whether new regions follow by default. Per region after that - /parcel follow toggles one,
    # and the "Follow player height" switch in /parcel style makes it stick.
    #
    # Off by default: following is right while you are stood inside looking around, and wrong the
    # moment you back away to judge the footprint, because the plane comes with you and you can
    # never see it from outside.
    default: false

    # How close a player must be to the FOOTPRINT (not its centre) for the plane to follow.
    radius: 32.0

    # How far below their feet it sits.
    offset: 3.0

    # How often the target height is recalculated.
    interval-ticks: 5

    # How long the client is told each move takes. Deliberately LONGER than interval-ticks: if the
    # announced duration equals the gap, the client sits exactly on the boundary and any late
    # packet strands it on a finished move. Overshooting keeps it mid-interpolation, so a late
    # update re-aims it instead of stuttering. Costs a constant lag equal to the overshoot.
    interpolation-ticks: 9

  # How far away panels stay rendered. This is a multiplier on the client's entity render distance,
  # not blocks - the default of 1.0 is far too short for something you stand inside.
  view-range: 4.0

  # Added to the culling box on each axis. The client culls a display on its BOUNDING BOX, not on
  # what it draws, and the default box is a point - so a panel spanning a whole face disappears
  # whenever its origin leaves your view. Raise this if faces pop out of existence.
  culling-padding: 2.0

  # Refuse to render a mesh larger than this rather than spawning thousands of entities.
  max-panels: 512

  # Show a render only to whoever asked for it.
  # Panels are real entities, so without this every player on the server sees every rendered region
  # - somebody's working overlay draped over the map. The particle visualisers are private for
  # free, because particles are sent per player; entities have to be hidden deliberately.
  # Turn it off for renders everyone should see, such as a permanent arena boundary.
  viewer-only: true

  # WIREFRAME primitive: a particle grid over the meshed surface. No entities, so it costs nothing
  # to leave on and cannot leave anything behind. Grid spacing is per style, set in /parcel style.
  wireframe:
    interval-ticks: 4

    # Only the part of a grid within this many blocks of you is drawn - a large region's full
    # lattice is far too many points, and you can only see the near part regardless.
    range: 48.0

    # Blocks between particles along a grid line.
    resolution: 0.5

    # Ceiling per player per pass, shared across every wireframed region, so a busy view degrades
    # evenly instead of the first region using the whole budget.
    max-points: 900

    # How far BELOW your feet a followed flat region's outline sits.
    #
    # Separate from panels.follow.offset and zero on purpose. A solid display plane at eye level is
    # in your face, so panels drop a few blocks to stay readable; a particle outline is not, and
    # sitting it exactly at your feet is what makes it read the same as the selection outline.
    follow-offset: 0.0

outline:
  # Particle outlines of your selection, and of any region you /parcel show.
  # Sent per player, so guides are never visible to anyone else.
  enabled: true
  interval-ticks: 4

  # Only the part of an outline within this many blocks of you is drawn. This is what keeps a
  # full-height prism affordable - its vertical edges are 384 blocks long and you can only see a
  # few of that anyway.
  range: 48.0

  # Distance between particles along an edge. Corners are always drawn.
  spacing: 1.0

  # Hard ceiling on particles per player per pass, shared across every box being drawn, so a large
  # selection degrades evenly instead of the first part using the whole budget.
  max-points: 600

  # Flat (prism) shapes are drawn as a cross-section at your own height rather than as a real box,
  # matching what the display panels do. Drawing the true shape meant four columns running from
  # bedrock to the build limit, which looked like a bug and told you nothing the footprint did not.
  #
  # This is how far above your feet that outline sits. 0 puts it at floor level, which is usually
  # what you want when marking corners; raise it if terrain keeps swallowing the line.
  flat-offset: 0.0
